; ---------------------------------------------------------------------------
; One build environment per node. Each sets that node's ID and Wi-Fi name, so
; the source code never has to be edited before flashing.
;
; HOW TO FLASH A BOARD
;   VS Code: click the "env:..." selector in the blue status bar, pick the node
;   (e.g. env:node3), then click Upload (->). Or in the PlatformIO sidebar:
;   Project Tasks > node3 > Upload.
;   Terminal: pio run -e node3 -t upload --upload-port COM5
; Then label the board with its node number.
;
; V1 = Main Hub (barangay hall), V2-V5 = Mini Hubs, V6 = Distant Edge Node.
; ---------------------------------------------------------------------------

[platformio]
; Safety: the plain Upload button only ever flashes this env. Switch env first.
default_envs = node1

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
; Type a whole command (e.g. "routes"), see it as you type, send it with Enter.
monitor_filters = send_on_enter
monitor_echo = yes
; CDC_ON_BOOT=0: serial goes through the Heltec V3's USB-serial chip (the COM
; port). With =1 it would go to the ESP32's native USB pins and the monitor stays blank.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D ARDUINO_USB_MODE=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    jgromes/RadioLib@^7.1.2
    https://github.com/mathieucarbou/ESPAsyncWebServer.git#v3.1.5
    https://github.com/mathieucarbou/AsyncTCP.git

[env:node1]
build_flags = ${env.build_flags} -D NODE_ID_CFG=1 -D AP_SSID_CFG=\"EMERGENCY-HUB-01\"

[env:node2]
build_flags = ${env.build_flags} -D NODE_ID_CFG=2 -D AP_SSID_CFG=\"EMERGENCY-HUB-02\"

[env:node3]
build_flags = ${env.build_flags} -D NODE_ID_CFG=3 -D AP_SSID_CFG=\"EMERGENCY-HUB-03\"

[env:node4]
build_flags = ${env.build_flags} -D NODE_ID_CFG=4 -D AP_SSID_CFG=\"EMERGENCY-HUB-04\"

[env:node5]
build_flags = ${env.build_flags} -D NODE_ID_CFG=5 -D AP_SSID_CFG=\"EMERGENCY-HUB-05\"

[env:node6]
build_flags = ${env.build_flags} -D NODE_ID_CFG=6 -D AP_SSID_CFG=\"EMERGENCY-HUB-06\"
